site_name: DSS Material
site_description: Material Design 3 specifications in Design System Spec format
site_url: https://plexusone.dev/dss-material
repo_url: https://github.com/plexusone/dss-material
repo_name: plexusone/dss-material

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css
  - css/dss-material.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  # DSS Spec Viewer - standalone HTML sub-site with enhanced UI
  # Generated by `dss render -o docs/specs`
  - Specs: specs/index.html
  - Integration:
      - MCP Server: integration/mcp.md
      - Claude Desktop: integration/claude-desktop.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/dss-material
